<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War II Tanks Encyclopedia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <div>
            <h1>World War II Tanks </h1>
            <p>Bách khoa toàn thư xe tăng Thế chiến II</p>
        </div>

        <label class="switch" aria-label="Bật hoặc tắt chế độ tối">
            <input type="checkbox" id="darkMode">
            <span class="slider"></span>
        </label>
    </header>

    <aside class="sidebar">
        <div class="filter-group">
            <h2>Tìm kiếm</h2>
            <input
                class="search-input"
                type="search"
                id="search"
                placeholder="Nhập tên xe tăng..."
                autocomplete="off"
            >
        </div>

        <div class="filter-group">
            <h2>Quốc gia</h2>
            <div id="countryList" class="country-options"></div>
        </div>

        <button type="button" id="clearFilter" class="clear-btn">
            Xóa bộ lọc
        </button>
    </aside>

    <main class="main">
        <div class="result-bar">
            <h2>Danh sách xe tăng</h2>
            <span id="resultCount"></span>
        </div>
        <div class="tank-grid" id="tankList"></div>
    </main>
</div>

<div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalName">
        <button type="button" id="close" class="modal-close" aria-label="Đóng">&times;</button>
        <img id="modalImage" src="" alt="">
        <div class="modal-body">
            <h2 id="modalName"></h2>
            <div class="modal-specs">
                <p><b>Quốc gia:</b> <span id="modalCountry"></span></p>
                <p><b>Năm:</b> <span id="modalYear"></span></p>
                <p><b>Khối lượng:</b> <span id="modalWeight"></span></p>
                <p><b>Pháo chính:</b> <span id="modalGun"></span></p>
                <p><b>Tốc độ:</b> <span id="modalSpeed"></span></p>
            </div>
            <p id="modalDescription" class="modal-description"></p>
            <a id="detailLink" class="detail-btn modal-detail" href="#">Xem hồ sơ chi tiết</a>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/script.js"></script>
</body>
</html>
